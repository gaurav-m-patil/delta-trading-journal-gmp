name: 24/7 Delta Cloud Sentinel Bot

on:
  repository_dispatch:
    types: [run_sentinel]
  workflow_dispatch:

concurrency:
  group: delta-sentinel-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run 24/7 Cloud Sentinel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scripts/cloud_sentinel.py

      - name: Commit updated sentinel state
        run: |
          mkdir -p data
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(sentinel): update state [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi
