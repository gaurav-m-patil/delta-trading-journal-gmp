name: Sync Delta Exchange Journal

on:
  schedule:
    - cron: '30 18 * * *' # Runs daily at 18:30 UTC (00:00 IST midnight)
  workflow_dispatch:      # Manual "Run workflow" trigger

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute data fetch and aggregation engine
        env:
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scripts/fetch_delta.py

      - name: Commit and push updated trading metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trade_journal.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update trade journal [skip ci]" && git push)
